<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskBytes</title>
    <script>
      // Pre-mount theme application (BuildPrompt §14): the saved theme
      // (localStorage) or prefers-color-scheme is applied BEFORE React
      // mounts so there is no flash. Runs synchronously in <head>.
      (function () {
        try {
          var saved = localStorage.getItem("diskbytes.theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
